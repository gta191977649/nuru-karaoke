<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber Karaoke Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000;
        font-family: 'Zen Kaku Gothic New', sans-serif;
        overflow: hidden;
      }
      /* Custom Font Classes */
      .font-digital { font-family: 'Orbitron', sans-serif; }
      .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
      
      /* Circuit Background Pattern - Updated for Blue/Tech look */
      .bg-circuit {
        background-color: #020410;
        background-image: 
          linear-gradient(rgba(0, 100, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 100, 255, 0.07) 1px, transparent 1px),
          radial-gradient(circle at 50% 50%, rgba(20, 30, 80, 0.5), transparent 80%);
        background-size: 50px 50px, 50px 50px, 100% 100%;
      }

      /* CRT Scanline Effect */
      .scanlines::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
    </style>
