{% extends "base.html" %}

{% block title %}Tags{% endblock %}

{% block content %}
  <div class="card p-4">
    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-3">
      <div>
        <h2 class="mb-1">Tags</h2>
        <div class="text-muted">Use tags to group songs by genre or language</div>
      </div>
      <a class="btn btn-primary" href="{% url 'ui_tag_create' %}">New Song</a>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tags %}
          <tr>
            <td>{{ tag.name }}</td>
            <td>
              <a class="btn btn-sm btn-outline-danger" href="{% url 'ui_tag_delete' tag.pk %}">Delete</a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-muted">No tags yet.</td>
          </tr>
        {% endfor %}
      </tbody>
      </table>
    </div>
  </div>
{% endblock %}
