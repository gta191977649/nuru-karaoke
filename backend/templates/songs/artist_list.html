{% extends "base.html" %}

{% block title %}Artists{% endblock %}

{% block content %}
  <div class="card p-4">
    <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-3">
      <div>
        <h2 class="mb-1">Artists</h2>
        <div class="text-muted">Browse all artists</div>
      </div>
    </div>

    <form method="get" class="row g-3 align-items-end mb-3">
      <div class="col-md-6">
        <label class="form-label">Search Artist</label>
        <input type="text" name="q" value="{{ q }}" placeholder="Artist name" class="form-control" />
      </div>
      <div class="col-md-2 d-grid">
        <button class="btn btn-outline-secondary" type="submit">Filter</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table align-middle">
      <thead>
        <tr>
          <th>Artist</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for artist in artists %}
          <tr>
            <td>
              <a class="link-danger fw-semibold" href="{% url 'ui_artist_detail' artist.id %}">{{ artist.name }}</a>
            </td>
            <td>
              <a class="btn btn-sm btn-outline-primary" href="{% url 'ui_artist_edit' artist.id %}">Edit</a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-muted">No artists found.</td>
          </tr>
        {% endfor %}
      </tbody>
      </table>
    </div>
  </div>
{% endblock %}
