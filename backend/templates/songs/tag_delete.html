{% extends "base.html" %}

{% block title %}Delete Tag{% endblock %}

{% block content %}
  <div class="card p-4 mx-auto" style="max-width: 520px;">
    <h2 class="mb-3">Delete Tag</h2>
    <p>Are you sure you want to delete <strong>{{ tag.name }}</strong>?</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Delete</button>
      <a class="btn btn-outline-secondary" href="{% url 'ui_tag_list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
