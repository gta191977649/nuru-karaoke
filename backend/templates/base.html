<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RAKUSONG 楽曲{% endblock %}</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bs-primary: #e60000;
        --bs-primary-rgb: 230, 0, 0;
        --bs-link-color: #e60000;
        --bs-link-hover-color: #b30000;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: #f5f6f8;
        color: #1b1f24;
      }
      .page-shell {
        max-width: 1100px;
      }
      .card {
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        border: none;
      }
      .table thead th {
        color: #6b7280;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 12px;
      }
      .pill {
        display: inline-flex;
        padding: 2px 10px;
        border-radius: 999px;
        background: #fde8e8;
        color: #b30000;
        font-size: 12px;
        margin-right: 6px;
      }
      .muted {
        color: #6b7280;
      }
      .dropzone {
        border: 2px dashed rgba(230, 0, 0, 0.45);
        border-radius: 14px;
        padding: 26px;
        text-align: center;
        background: #fff6f6;
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #6b7280;
      }
      .dropzone.is-dragover {
        background: #ffeaea;
        border-color: #e60000;
        color: #1f2937;
      }
      .dropzone-icon {
        font-size: 30px;
        color: #e60000;
        margin-bottom: 6px;
      }
      .dropzone-filename {
        margin-top: 8px;
        font-size: 12px;
        color: #111827;
        font-weight: 600;
        word-break: break-all;
      }
      .dropzone strong {
        color: #1f2937;
      }
      .dropzone .browse {
        color: #e60000;
        font-weight: 600;
      }
      .dropzone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .dropzone-wrap {
        position: relative;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: #e60000;">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="{% url 'ui_song_list' %}">RAKUSONG 楽曲</a>
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="{% url 'ui_song_list' %}">Songs</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'ui_artist_list' %}">Artists</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'ui_tag_list' %}">Tags</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'ui_leaderboard' %}">Leaderboard</a></li>
          </ul>
          {% if request.user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
              <span class="text-white-50 small">Hello {{ request.user.username }}</span>
              <a class="btn btn-light btn-sm" href="{% url 'ui_logout' %}">Logout</a>
            </div>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container page-shell py-4">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"></script>
  </body>
</html>
