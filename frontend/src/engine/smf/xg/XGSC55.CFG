; Yamaha XG -> Roland SC-55 drum-only map for the Synth Engine.
; Melodic bank, program, controller and note events intentionally pass through.
;
; Program and note values are zero-based MIDI values.
; SC-55 has no true XG Snare Roll or several XG-only kit variations.
; Those entries use the nearest SC-55 articulation instead of passing an
; incompatible note through (for example XG note 29 is not SC-55 note 29).
;
[SOURCE]
YAMAHA XG,43,0
[DESTINATION]
Roland SC-55,41,0
;
[DRUMS]
;
